name: Build GOTY
on:
  push:
    branches:
      - archipelago
      - force-mid-wave-flag
  pull_request:
  release:
    types:
      - created

jobs:
  build:
    runs-on: windows-latest
    strategy: 
      fail-fast: false
      matrix:
        configuration: [ReleaseGOTY, DebugGOTY]
        platform: [x64, Win32]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: 
          submodules: recursive
      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: msbuild
        run: |
          msbuild /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} PlantsVsZombies.sln
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PlantsVsZombies-GOTY-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            build/${{ matrix.configuration }}_${{ matrix.platform }}/bin
  release-to-created-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [ReleaseGOTY]
        platform: [x64, Win32]
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write
    needs:
      - build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlantsVsZombies-GOTY-${{ matrix.configuration }}-${{ matrix.platform }}
          path: artifact-output
      - name: Archive
        run: |
          zip -r PlantsVsZombies-GOTY-AP-${{ matrix.platform }}.zip artifact-output
      - name: Upload Release
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ github.token }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/octet-stream" \
          "https://uploads.github.com/repos/${{ github.event.repository.owner.login }}/${{ github.event.repository.name }}/releases/${{ github.event.release.id }}/assets?name=PlantsVsZombies-GOTY-AP-${{ matrix.platform }}.zip" \
          --data-binary "@PlantsVsZombies-GOTY-AP-${{ matrix.platform }}.zip"
